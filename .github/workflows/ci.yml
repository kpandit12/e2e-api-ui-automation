name: e2e-api-ui-automation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  QA_PROFILE: ci
  QA_API_BASE_URL: http://localhost:3000
  QA_UI_BASE_URL: http://localhost:3000
  QA_HEADLESS: "true"
  QA_BROWSER: chromium
  PYTHON_VERSION: "3.10"

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: MyPy
        run: mypy .

  api-tests:
    runs-on: ubuntu-latest
    needs: static-checks
    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Wait for Juice Shop
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/rest/products/search?q=apple && break
            echo "Waiting for Juice Shop..."
            sleep 2
          done

      - name: Run API tests
        run: |
          pytest tests/api/unit tests/api/integration tests/api/contract \
            -q --tb=short --alluredir=reports/allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: reports/allure-results

  ui-tests:
    runs-on: ubuntu-latest
    needs: static-checks
    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright browser & deps
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Wait for Juice Shop
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/rest/products/search?q=apple && break
            echo "Waiting for Juice Shop..."
            sleep 2
          done

      - name: Run UI tests
        run: |
          pytest tests/ui -v --tb=long \
            --tracing retain-on-failure \
            --video retain-on-failure \
            --alluredir=reports/allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: reports/allure-results

      - name: Upload Playwright traces & videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-ui
          path: test-results/
          if-no-files-found: ignore

  allure-report:
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests]
    if: always()
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          path: reports/allure-results
          pattern: allure-results-*
          merge-multiple: true

      - name: Install Allure CLI
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure-2.29.0.tgz
          echo "$PWD/allure-2.29.0/bin" >> "$GITHUB_PATH"

      - name: Generate Allure report
        run: |
          allure generate reports/allure-results -o reports/allure-report --clean

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload report to Pages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/allure-report

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
