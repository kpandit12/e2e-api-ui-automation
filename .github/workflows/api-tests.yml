name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1: static analysis. Fails the build on any lint/type/format error.
  # ---------------------------------------------------------------------------
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy .

  # ---------------------------------------------------------------------------
  # Gate 2: unit tests (mocked transport, no network). Fast and deterministic.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run unit suite
        run: pytest tests/unit -m unit -n auto --junitxml=results-unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-unit
          path: results-unit.xml

  # ---------------------------------------------------------------------------
  # Gate 3: integration + contract against the live public API.
  # restful-booker is public and needs no secrets. Reruns absorb known
  # rate-limit flakiness (tests are tagged @pytest.mark.flaky); a non-flaky
  # failure still fails the job.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration & contract tests
    runs-on: ubuntu-latest
    needs: unit
    env:
      PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run integration + contract suites
        run: |
          pytest tests/integration tests/contract \
            -n auto \
            --reruns 2 --reruns-delay 5 \
            --alluredir=./allure-results \
            --junitxml=results.xml
      - name: Upload JUnit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-integration
          path: results.xml
      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results

  # ---------------------------------------------------------------------------
  # Publish the Allure HTML report to GitHub Pages on merge to main.
  # ---------------------------------------------------------------------------
  publish-report:
    name: Publish Allure report
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results
      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.9
        with:
          allure_results: allure-results
          allure_report: allure-report
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
